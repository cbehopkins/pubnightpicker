name: last_orders image

on:
  push:
    tags:
      - "v*"
      - "last_orders-v*"
      - "release-v*"

permissions:
  contents: read

concurrency:
  group: last-orders-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate release tag and commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^(release-|last_orders-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected release-vX.Y.Z, last_orders-vX.Y.Z or vX.Y.Z (no prerelease suffix or leading zeroes)"
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Release commit must belong to main"
            exit 1
          }

  go-test:
    name: go test (${{ matrix.module }})
    needs: validate-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - last_orders
          - cellar
          - durable_email
          - email_clients

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-and-push:
    name: Build and push to Scaleway Container Registry
    needs: go-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate registry configuration
        id: image
        shell: bash
        env:
          REGISTRY_ENDPOINT: ${{ vars.SCALEWAY_REGISTRY_ENDPOINT }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$REGISTRY_ENDPOINT" =~ ^rg\.[a-z0-9-]+\.scw\.cloud/[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Set SCALEWAY_REGISTRY_ENDPOINT to rg.<region>.scw.cloud/<namespace> (no scheme or trailing slash)"
            exit 1
          fi
          if [[ -z "$SCALEWAY_API_KEY" ]]; then
            echo "Set the SCALEWAY_API_KEY GitHub Actions secret"
            exit 1
          fi
          echo "registry=${REGISTRY_ENDPOINT%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REGISTRY_ENDPOINT}/last_orders" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Resolve build commit
        id: build-identity
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: last_orders/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_TAG=${{ github.ref_name }}
            BUILD_COMMIT=${{ steps.build-identity.outputs.commit }}
            BUILD_KIND=release
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=last_orders
          cache-to: type=gha,mode=max,scope=last_orders
