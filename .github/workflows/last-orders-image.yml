name: last_orders image

on:
  push:
    branches:
      - main
    paths:
      - "last_orders/**"
      - "cellar/**"
      - "durable_email/**"
      - "email_clients/**"
      - ".github/workflows/last-orders-image.yml"
    tags:
      - "v*"
      - "last_orders-v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: last-orders-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-test:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - last_orders
          - cellar
          - durable_email
          - email_clients

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-and-push:
    name: Build and push to GHCR
    needs: go-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/last_orders" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: last_orders/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=last_orders
          cache-to: type=gha,mode=max,scope=last_orders
