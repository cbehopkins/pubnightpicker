name: last_orders image

on:
  push:
    branches:
      - main
      - "diagnose_*"
    paths:
      - "last_orders/**"
      - "cellar/**"
      - "durable_email/**"
      - "email_clients/**"
      - ".github/workflows/last-orders-image.yml"
    tags:
      - "v*"
      - "last_orders-v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: last-orders-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-test:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - last_orders
          - cellar
          - durable_email
          - email_clients

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build-and-push:
    name: Build and push to GHCR
    needs: go-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/last_orders" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: last_orders/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=last_orders
          cache-to: type=gha,mode=max,scope=last_orders

  deploy:
    name: Deploy tagged image to Scaleway
    needs: build-and-push
    # Only an explicitly versioned Last Orders release tag deploys production.
    if: startsWith(github.ref, 'refs/tags/last_orders-v')
    runs-on: ubuntu-latest
    concurrency:
      group: last-orders-scaleway-production
      cancel-in-progress: false
    steps:
      - name: Update image and redeploy Scaleway container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_REGION: ${{ vars.SCW_CONTAINERS_REGION }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/last_orders:${GITHUB_REF_NAME}"

          : "${SCW_SECRET_KEY:?Set the SCW_SECRET_KEY repository secret}"
          : "${SCW_REGION:?Set the SCW_CONTAINERS_REGION repository variable}"
          : "${SCW_CONTAINER_ID:?Set the SCW_CONTAINER_ID repository variable}"

          API="https://api.scaleway.com/containers/v1/regions/${SCW_REGION}/containers/${SCW_CONTAINER_ID}"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "X-Auth-Token: ${SCW_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "${IMAGE}" '{image: $image}')" \
            "${API}"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Auth-Token: ${SCW_SECRET_KEY}" \
            "${API}/redeploy"
