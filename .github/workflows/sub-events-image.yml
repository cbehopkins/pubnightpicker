name: sub_events image

on:
  push:
    branches:
      - main
    paths:
      - "firebase_sub/**"
      - ".github/workflows/sub-events-image.yml"
    tags:
      - "v*"
      - "sub_events-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sub-events-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/sub_events" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: firebase_sub
          file: firebase_sub/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
