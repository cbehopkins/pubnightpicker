name: email_clients CI

on:
  pull_request:
    paths:
      - "email_clients/**"
      - ".github/workflows/email-clients-ci.yml"
  push:
    branches:
      - main
    paths:
      - "email_clients/**"
      - ".github/workflows/email-clients-ci.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-clients-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go checks (email_clients)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email_clients
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: email_clients/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Test with race detection
        run: go test -race ./...

  vulnerabilities:
    name: Vulnerability scan (email_clients)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email_clients
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: email_clients/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan for vulnerabilities
        run: govulncheck ./...