name: durable_email CI

on:
  pull_request:
    paths:
      - "durable_email/**"
      - "email_clients/**"
      - "cellar/**"
      - ".github/workflows/durable-email-ci.yml"
  push:
    branches:
      - main
    paths:
      - "durable_email/**"
      - "email_clients/**"
      - "cellar/**"
      - ".github/workflows/durable-email-ci.yml"
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-email-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go checks (durable_email)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: durable_email
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: durable_email/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Staticcheck
        # Remove this exception when Staticcheck fixes the SA4023 nilness panic.
        run: |
          set +e
          output=$(staticcheck ./... 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 2 &&
                "$output" == *'panic: runtime error: index out of range [1] with length 1'* &&
                "$output" == *'honnef.co/go/tools/analysis/facts/nilness.(*Result).Nilness'* &&
                "$output" == *'honnef.co/go/tools/staticcheck/sa4023.run'* ]]; then
            echo '::warning::Staticcheck v0.8.1 crashed in SA4023; temporarily tolerating this known analyser bug. Lint coverage is incomplete.'
          else
            exit "$status"
          fi

      - name: Test with race detection
        run: go test -race ./...

  vulnerabilities:
    name: Vulnerability scan (durable_email)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: durable_email
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: durable_email/go.mod
          cache-dependency-path: "*/go.sum"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan for vulnerabilities
        run: govulncheck ./...
