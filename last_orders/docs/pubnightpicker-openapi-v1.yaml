openapi: 3.1.0
info:
  title: PubNightPicker API
  version: 1.0.0
  summary: HTTP API for PubNightPicker groups, venues, locations and Meets.
  description: |
    Review draft. Firestore is an implementation detail and is not part of this
    contract. IDs are opaque strings. Authentication uses Firebase-issued bearer
    tokens verified by the API.

    The implemented Group API is currently limited to GET /groups. Other Group
    operations in this draft are not implemented. Discovery deliberately departs
    from ADR-011 and ADR-012 for this phase: only public Groups are returned to
    every caller, including authenticated callers; membership-based private
    discovery is not implemented.

    Authentication may be omitted for public group discovery and public resource
    reads. If an Authorization bearer token is supplied, it must be valid; invalid
    or expired credentials produce 401 rather than anonymous fallback.

    The broader design uses Groups as the boundary for membership, permissions,
    settings and Meet discovery. Those authorisation behaviours are not implied
    by the currently implemented discovery endpoint.
servers:
  - url: https://api.example.invalid/api
    description: Replace with the deployed API base URL, including `/api`.
tags:
  - name: Groups
  - name: Group members
  - name: Group permissions
  - name: Group settings
  - name: Locations
  - name: Venues
  - name: Meets
  - name: Voting
  - name: Attendance
security:
  - bearerAuth: []
paths:
  /groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List public groups
      description: |
        This is the only implemented Group operation in this phase. Authentication
        is optional; anonymous and authenticated callers receive public Groups
        only. Private Groups are never disclosed, including to members or global
        administrators. This interim rule deliberately differs from ADR-011 and
        ADR-012; membership-aware discovery is not implemented.

        `name`, when supplied, is an exact, case-sensitive match. Startup requires
        a non-empty authoritative Firestore Groups collection whose documents all
        have a non-empty name and a supported `public` or `private` visibility,
        with no duplicate exact-case names. The local projection follows live
        changes. If the collection later becomes empty, discovery returns an empty
        array and the backend remains running.

        Invalid or expired supplied bearer tokens return 401; they are not treated
        as anonymous requests. No matches are represented by 200 with an empty array.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          required: false
          description: Exact, case-sensitive Group-name match.
          schema:
            type: string
      responses:
        '200':
          description: Public Groups available to any caller.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupSummary'
              examples:
                found:
                  value:
                    groups:
                      - id: opaque-group-id
                        name: ampubnight
                        visibility: public
                noMatches:
                  value:
                    groups: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create a group
      description: |
        Requires a valid authenticated caller. The creator becomes a member and
        is granted the group's admin permission as part of the creation operation.
        Group creation and initial admin assignment must succeed or fail as one
        logical operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created.
          headers:
            Location:
              description: URL of the created group.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get group details
      description: |
        Authentication is optional for public groups. A private group is returned
        only to a caller authorised to discover it. Unknown and inaccessible groups
        both return 404.
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Group details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Groups]
      operationId: updateGroup
      summary: Update group identity and basic settings
      description: Requires group-admin permission. This operation does not update permissions, membership, or feature settings.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Group members]
      operationId: listGroupMembers
      summary: List group members
      description: Requires permission to manage the group or otherwise view its membership.
      responses:
        '200':
          description: Current members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/GroupMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Group members]
      operationId: addGroupMember
      summary: Add a group member
      description: Requires group-admin permission. Idempotently ensures the user is a member.
      responses:
        '204':
          description: User is now a member.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Group members]
      operationId: removeGroupMember
      summary: Remove a group member
      description: |
        Requires group-admin permission. The implementation must prevent removal
        of the last group administrator unless administrative responsibility is
        transferred in the same operation.
      responses:
        '204':
          description: User is no longer a member.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}/permissions:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Group permissions]
      operationId: getGroupPermissions
      summary: Get group permission assignments
      description: Requires group-admin permission. Returns the permission-oriented view; each permission maps to user IDs granted that permission.
      responses:
        '200':
          description: Permission assignments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPermissions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}/permissions/{permission}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: permission
        in: path
        required: true
        description: Stable permission key recognised by the server, such as admin or canCompleteMeet.
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Group permissions]
      operationId: grantGroupPermission
      summary: Grant a group permission to a user
      description: Requires group-admin permission. The user must be a member of the group. Permission keys are validated by the server.
      responses:
        '204':
          description: Permission is granted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Group permissions]
      operationId: revokeGroupPermission
      summary: Revoke a group permission from a user
      description: Requires group-admin permission. The server must prevent removal of the last admin permission.
      responses:
        '204':
          description: Permission is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /groups/{group_id}/settings:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Group settings]
      operationId: getGroupSettings
      summary: Get group feature settings
      description: Requires group-admin permission. Operational settings such as automation schedules and notification destinations are not exposed by public group reads.
      responses:
        '200':
          description: Group settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Group settings]
      operationId: updateGroupSettings
      summary: Update group feature settings
      description: Requires group-admin permission. Only documented settings are accepted; unsupported properties must not be silently persisted.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/GroupSettingsPatch'
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSettingsPatch'
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List locations
      description: Lists locations available to the caller. Results exclude soft-deleted locations.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by the previous response.
          schema:
            type: string
      responses:
        '200':
          description: Locations page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Locations]
      operationId: createLocation
      summary: Create a location
      description: Requires the appropriate global administrative permission.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationWrite'
      responses:
        '201':
          description: Location created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /locations/{location_id}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags: [Locations]
      operationId: getLocation
      summary: Get a location
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Location details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Locations]
      operationId: updateLocation
      summary: Update a location
      description: Requires the appropriate global administrative permission.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/LocationPatch'
      responses:
        '200':
          description: Updated location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Locations]
      operationId: deleteLocation
      summary: Soft-delete a location
      description: Requires the appropriate global administrative permission. The location is marked deleted rather than physically removed.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Location soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /venues:
    get:
      tags: [Venues]
      operationId: listVenues
      summary: Search venues
      description: |
        Authentication is optional and does not change the returned data. Lists
        all non-deleted venues, including banned venues. Only pub venues
        participate in automatic venue selection.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: location_id
          in: query
          required: false
          schema:
            type: string
        - name: venue_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/VenueType'
        - name: name
          in: query
          required: false
          description: Case-insensitive substring match.
          schema:
            type: string
        - name: food
          in: query
          required: false
          schema:
            type: boolean
        - name: dog_friendly
          in: query
          required: false
          schema:
            type: boolean
        - name: beer_garden
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: Signed pagination cursor returned by the previous page; bound to the query filters and projection generation.
          schema:
            type: string
      responses:
        '200':
          description: Venue results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Venues]
      operationId: createVenue
      summary: Create a venue
      description: Requires the caller's `canManagePubs` permission or global `admin` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VenueWrite'
      responses:
        '201':
          description: Venue created.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /venues/{venue_id}:
    parameters:
      - $ref: '#/components/parameters/VenueId'
    get:
      tags: [Venues]
      operationId: getVenue
      summary: Get a venue
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Venue details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Venues]
      operationId: updateVenue
      summary: Update a venue
      description: Requires the caller's `canManagePubs` permission or global `admin` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/VenuePatch'
      responses:
        '200':
          description: Updated venue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Venue'
        '400':
          description: The venue patch is invalid or one of its signed field tokens cannot be verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_edit_token
                  message: A venue field baseline token is invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One or more submitted venue fields conflict with values committed since their baselines were issued. No patch fields are applied.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_venue]
                properties:
                  error:
                    type: object
                    required: [code, message, fields]
                    properties:
                      code:
                        type: string
                        enum: [field_conflict]
                      message:
                        type: string
                      fields:
                        type: array
                        items:
                          type: string
                  current_venue:
                    $ref: '#/components/schemas/Venue'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Venues]
      operationId: deleteVenue
      summary: Soft-delete a venue
      description: Requires the caller's `canManagePubs` permission or global `admin` role. This is distinct from the `banned` domain property. Send the quoted `delete_token` from the venue representation in `If-Match`.
      parameters:
        - in: header
          name: If-Match
          required: true
          description: Strong entity tag containing the venue's signed whole-document delete token.
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Venue soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          description: The If-Match token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: invalid_edit_token
                  message: A venue delete token is invalid.
        '412':
          description: The venue changed since the supplied token was issued. No deletion occurred.
          content:
            application/json:
              schema:
                type: object
                required: [error, current_venue]
                properties:
                  error:
                    $ref: '#/components/schemas/ErrorResponse/properties/error'
                  current_venue:
                    $ref: '#/components/schemas/Venue'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /venues/stream:
    get:
      tags: [Venues]
      operationId: streamVenues
      summary: Stream the complete venue list
      description: |
        Public full-snapshot stream for the venue list page. The initial event
        and each subsequent event contain the complete non-deleted venue list,
        sorted by name. Any committed venue addition, edit or deletion causes
        a replacement snapshot. `id` and `cursor` carry the same opaque
        resumption cursor. The stream uses the same public data for every caller.
        A malformed, stale, wrong-scope, wrong-generation or otherwise unusable
        `Last-Event-ID` is ignored; the connection still receives a fresh full
        snapshot and cursor.
      security:
        - {}
      responses:
        '200':
          description: Server-sent events containing complete venue snapshots.
          content:
            text/event-stream:
              schema:
                type: string
        '503':
          description: The venue projection is not ready.
  /meets/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Meets]
      operationId: createMeet
      summary: Create an open Meet
      description: Requires `canCreatePoll`, global-admin inheritance and Group visibility. Past or future calendar dates are valid. Multiple manual Meets may exist for the same Group/date.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  format: date
      responses:
        '201':
          description: Committed Meet, empty votes and attendance documents, and creation audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}/candidates/{venue_id}:
    parameters:
      - $ref: '#/components/parameters/MeetId'
      - in: path
        name: venue_id
        required: true
        schema:
          type: string
    put:
      tags: [Voting]
      operationId: addMeetCandidate
      summary: Add a Venue candidate
      description: Requires `canAddPubToPoll`. The operation is atomic and a duplicate is a no-op while voting remains open.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Committed Meet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Voting]
      operationId: removeMeetCandidate
      summary: Remove a Venue candidate
      description: Requires `canAddPubToPoll`. Removed-candidate votes remain stored; an absent candidate is a no-op while voting remains open.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Committed Meet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /meets/{group_id}/current:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Meets]
      operationId: listCurrentMeets
      summary: List current Meets for a group
      description: |
        Authentication is optional; invalid supplied credentials return 401.
        Returns completed voting-phase Meets whose local date is today or in
        the future, ordered by date then Meet ID, together with selected Venue
        summaries. Anonymous and authenticated callers may read public Groups;
        private Groups require membership or global administrator authority.
        Votes and attendance are separate concerns. The response includes an
        opaque cursor from the same consistent local snapshot, suitable for
        starting the corresponding stream.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Current Meets snapshot.
          headers:
            ETag:
              description: Optional HTTP validator for conditional requests.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentMeetsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The requested projection, required Venue data, or authoritative Meet access decision is temporarily unavailable.
  /meets/{group_id}/current/stream:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Meets]
      operationId: streamCurrentMeets
      summary: Stream changes to current Meets
      description: |
        Authentication is optional; invalid supplied credentials return 401.
        Public Groups permit anonymous streams; private Groups require membership
        or global administrator authority. Server-Sent Events. `after` is an opaque cursor from a snapshot;
        Last-Event-ID may be used on reconnect and takes precedence if both are
        supplied. Every connection receives a complete current-Meets replacement
        snapshot and a fresh cursor, then another complete replacement after each
        relevant Meet or selected Venue change. Votes and attendance do not
        trigger this stream. Invalid cursors recover with the same replacement,
        not an error. The subscriber is registered before the consistent
        snapshot read, so concurrent changes are not missed. SSE is unavailable
        until backend readiness and the requested entry's baseline are ready;
        this does not imply Firebase is globally caught up.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of current-Meets collection changes.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              description: Deployment hint to disable proxy buffering where applicable.
              schema:
                type: string
                example: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each message follows SSE framing. Event IDs are opaque cursors.
                  `event: current_meets` data is a complete replacement snapshot
                  of the collection. A generic `event: view_reset` is sent for
                  retirement, a detected required-watch failure, a committed
                  authorization change or London midnight, then the connection
                  closes. The reset has no ID and carries `data: {}`.
              example: |
                id: eyJ2IjoxLCJzdHJlYW0iOiJjdXJyZW50LW1lZXRzLXYxIn0.signature
                event: current_meets
                data: {"cursor":"eyJ2IjoxLCJzdHJlYW0iOiJjdXJyZW50LW1lZXRzLXYxIn0.signature","meets":[]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Backend readiness, the requested projection, required Venue data, or authoritative Meet access decision is temporarily unavailable.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
  /meets/{group_id}/open:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Meets]
      operationId: listOpenMeets
      summary: List voting-open Meets for a group
      description: |
        Authentication is optional; invalid supplied credentials return 401.
        Returns voting-open Meets belonging to the requested Group, regardless
        of scheduled date, ordered by date then Meet ID. The response includes
        candidate Venue IDs but no votes or attendance data. The opaque cursor
        corresponds to the same consistent local snapshot used by the stream.
        Time passing at London midnight does not change open-Meet membership.
        Anonymous and authenticated callers may read public Groups; private
        Groups require membership or global administrator authority.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Open Meets snapshot.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMeetsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The requested projection or authoritative Meet access decision is temporarily unavailable.
  /meets/{group_id}/open/stream:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Meets]
      operationId: streamOpenMeets
      summary: Stream changes to voting-open Meets
      description: |
        Authentication is optional; invalid supplied credentials return 401.
        Public Groups permit anonymous streams; private Groups require membership
        or global administrator authority. Server-Sent Events. Every authorised connection receives a complete
        open-Meets replacement snapshot and a fresh opaque cursor, then another
        replacement when open-Meet membership or displayed data changes. Voting
        and attendance changes do not trigger this stream. Open membership is
        independent of scheduled date and does not change at London midnight.
        Invalid cursors recover with a complete replacement. The subscriber is
        registered before the consistent snapshot read. Successful authorised
        connections renew the shared Group view's six-hour deadline.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of open-Meets collection changes.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  `event: open_meets` carries a complete replacement snapshot
                  with an opaque cursor. `event: view_reset` has no ID and
                  carries `data: {}` before a retired, failed or newly
                  unauthorised stream closes.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Backend readiness, the requested projection, or authoritative Meet access decision is temporarily unavailable.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
  /meets/{group_id}/past:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Meets]
      operationId: listPastMeets
      summary: List past Meets for a group
      description: Authentication is optional; invalid supplied credentials return 401. Returns voting-complete Meets for the requested Group with a scheduled date before today in Europe/London, newest first, ordered by date descending and Meet ID ascending for ties. Anonymous and authenticated callers may read public Groups; private Groups require membership or global administrator authority. Historical results are queried directly and do not admit individual Meet projections. Votes and attendance are omitted; no stream is provided for this collection.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          required: false
          description: Stable opaque pagination cursor from the previous page, scoped to this Group and London date. This is not a stream cursor.
          schema:
            type: string
      responses:
        '200':
          description: Past Meets page.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PastMeetsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The authoritative query, required Venue details, or authoritative Meet access decision is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}:
    parameters:
      - $ref: '#/components/parameters/MeetId'
    get:
      tags: [Meets]
      operationId: getMeet
      summary: Get a Meet
      description: Requires authentication. Public Group Meets are readable by any authenticated caller; private Group Meets require membership or global administrator authority. Only a true UID entry in the Group members map grants membership. Votes and attendance are separate concerns.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Meet details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The requested projection, required Venue data, or authoritative Meet access decision is temporarily unavailable.
    delete:
      tags: [Meets]
      operationId: deleteMeet
      summary: Delete an open or completed Meet
      description: Requires `canCreatePoll`. Atomically deletes the Meet and existing votes, attendance and open-action documents, and creates a deletion audit. Missing child documents are safe; chat and unrelated derived records are retained.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Meet deleted and deletion audit committed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}/votes:
    parameters:
      - $ref: '#/components/parameters/MeetId'
    get:
      tags: [Voting]
      operationId: getVoteSnapshot
      summary: Read a privacy-safe voting snapshot
      description: Requires authentication and the existing Meet visibility permission. Voting permission is not required. Returns active candidates and `any`, with distinct totals, anonymous counts and visible voter summaries. Hidden or unavailable voter profiles count anonymously. The caller's selected option IDs also include removed candidates and are sorted by ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current voting snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VotingSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The voting projection or authoritative Meet access decision is temporarily unavailable.
  /meets/{group_id}/votes/stream:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Voting]
      operationId: streamGroupVoteSnapshots
      summary: Stream privacy-safe voting snapshots for listed Meets in a Group
      description: |
        Requires authentication and Group access. One connection follows the
        votes of every listed Meet, so a page showing several Meets needs only
        one long-lived connection (browsers allow six HTTP/1.1 connections per
        origin). Each voting_snapshots event contains, for every listed Meet,
        its `meet_id` with the VotingSnapshot fields (without a per-Meet
        cursor), plus one opaque cursor, including on connection and reconnect.
        Vote, candidate and public
        profile changes to any listed Meet trigger a replacement. Clients
        reconnect with the new list when the Meets they show change. A listed
        Meet that is unknown or outside the Group returns 404. Authorization
        changes may produce a view_reset event and close the stream.
      security:
        - bearerAuth: []
      parameters:
        - name: meet_id
          in: query
          required: true
          description: Repeat once for each Meet to follow; between 1 and 50 distinct, non-empty IDs.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: string
              minLength: 1
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of complete voting snapshots for the listed Meets.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: opaque-cursor
                event: voting_snapshots
                data: {"cursor":"opaque-cursor","meets":[{"meet_id":"meet-id","options":[{"id":"any","total":2,"anonymous_count":1,"voters":[{"id":"user-id","name":"Display name"}]}],"selected_option_ids":[],"vote_revision":null}]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The voting projection or authoritative Meet access decision is temporarily unavailable.
  /meet/{meet_id}/votes/{venue_id}:
    parameters:
      - $ref: '#/components/parameters/MeetId'
      - name: venue_id
        in: path
        required: true
        description: Venue ID, or the reserved literal `any` meaning any venue is acceptable.
        schema:
          type: string
          minLength: 1
    put:
      tags: [Voting]
      operationId: addVote
      summary: Add the caller's vote for a venue
      description: Idempotently records that the authenticated caller votes for this venue or the special `any` option. A caller may vote for multiple options.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Vote recorded. State-changing and no-op writes against an existing document return the current Firestore document revision in `X-Vote-Revision` as UTC RFC3339Nano. Removal from an absent votes document has no revision header.
          headers:
            X-Vote-Revision:
              description: UTC RFC3339Nano Firestore votes document revision. Absent for an absent-document removal no-op.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Voting]
      operationId: removeVote
      summary: Remove the caller's vote for a venue
      description: Idempotently removes the authenticated caller's vote for this venue or the special `any` option.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Vote removed or already absent. State-changing and no-op writes against an existing document return the current Firestore document revision in `X-Vote-Revision` as UTC RFC3339Nano. Removal from an absent votes document has no revision header.
          headers:
            X-Vote-Revision:
              description: UTC RFC3339Nano Firestore votes document revision. Absent for an absent-document removal no-op.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}/complete:
    parameters:
      - $ref: '#/components/parameters/MeetId'
    post:
      tags: [Meets]
      operationId: completeMeet
      summary: Complete the voting phase and select the venue
      description: |
        Requires the caller's group permission to complete a Meet. Completion
        ends the voting phase but does not end the Meet lifecycle. `restaurant_time`
        is required when `restaurant_id` is supplied and must be omitted otherwise.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMeetRequest'
      responses:
        '200':
          description: Meet after completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}/reschedule:
    parameters:
      - $ref: '#/components/parameters/MeetId'
    post:
      tags: [Meets]
      operationId: rescheduleMeet
      summary: Change the selected venue or restaurant details
      description: Requires the caller's group permission to reschedule a completed Meet. The supplied date is rejected. Omitted restaurant fields are preserved; clearing the restaurant clears its time. The prior selected venue is appended to `previous_venue_ids` whenever it changes, preserving order and duplicates.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleMeetRequest'
      responses:
        '200':
          description: Meet after rescheduling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /account/attendance/cleanup:
    post:
      tags: [Attendance]
      operationId: cleanupMyAttendance
      summary: Remove the caller's attendance during account deletion
      description: Synchronously removes the verified caller's attendance and ETAs across all Meets. A failed scan can leave partial changes; retries are idempotent. Concurrent writes can reintroduce attendance.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of attendance documents updated by this successful attempt.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [updatedDocuments]
                properties:
                  updatedDocuments:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Attendance cleanup or authentication is temporarily unavailable.
  /attendance/statistics:
    get:
      tags: [Attendance]
      operationId: getAttendanceStatistics
      summary: Get historical attendance statistics across Groups
      description: |
        Requires the authenticated global admin role. `start` and `end` are
        inclusive ISO dates; the service returns effective can-come counts for
        completed Meets across all Groups, plus each Venue's latest Meet date.
        Standing any-Venue responses apply only to main Venues. Restaurants
        require explicit responses and never inherit any. Source failures are
        returned as 503, never as zero attendance.
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical attendance aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStatistics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Attendance statistics or authoritative role verification is temporarily unavailable.
  /meet/{meet_id}/attendance:
    parameters:
      - $ref: '#/components/parameters/MeetId'
    get:
      tags: [Attendance]
      operationId: getMeetAttendance
      summary: Get the detailed attendance snapshot
      description: |
        Requires authentication and voting-style Meet/Group visibility. Returns
        existing per-Venue status arrays, the separate any entry, applicable
        ETAs, public participant summaries and a snapshot cursor. Attendance
        identities are independent of vote-visibility preferences. Private
        profile fields are not returned; unavailable data is an error, not an
        empty snapshot.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Attendance snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Attendance or authoritative Group access is temporarily unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /meet/{meet_id}/attendance/{venue_id}:
    parameters:
      - $ref: '#/components/parameters/MeetId'
      - $ref: '#/components/parameters/VenueId'
    patch:
      tags: [Attendance]
      operationId: patchMyVenueAttendance
      summary: Partially change the caller's response or ETA
      description: Requires an authenticated true member of the Meet's Group. Status and ETA are optional and independent. An omitted ETA preserves it; null clears it. Setting a Venue ETA makes the caller able to come if necessary. Setting ETA on any is rejected. Repeating the same patch is idempotent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePatch'
      responses:
        '204':
          description: The caller's response or ETA was committed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Attendance or Group membership verification is unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Attendance]
      operationId: setMyVenueAttendance
      summary: Set the caller's response for a Venue or Any-Venue
      description: Requires an authenticated true member of the Meet's Group. Voting permission is not required. The server uses the verified UID and does not accept a caller-supplied identity. A Venue must belong to the Meet; completed Meets accept their selected Venue and restaurant. The literal any sets an independent standing response without copying or overwriting Venue entries. It is the fallback for main Venue candidates, never restaurants; explicit Venue responses take precedence. Changing any also atomically clears ETAs without effective can-come attendance while preserving ETAs for explicit can-come responses. Repeating the same status is idempotent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpdate'
      responses:
        '204':
          description: The caller's response was committed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Attendance or Group membership verification is unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Attendance]
      operationId: withdrawMyVenueAttendance
      summary: Withdraw the caller's Venue or Any-Venue response
      description: Requires an authenticated true member of the Meet's Group. Repeating a withdrawal is idempotent. The literal any withdraws the independent standing response and atomically clears ETAs that no longer have effective can-come attendance, preserving ETAs for explicit Venue can-come responses. A response for a removed Venue may be withdrawn when the caller has a response or the Meet records its removal; unrelated Venues are not accepted.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: The caller's response was withdrawn.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Attendance or Group membership verification is unavailable.
        '500':
          $ref: '#/components/responses/InternalError'
  /meets/{group_id}/attendance/stream:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Attendance]
      operationId: streamGroupAttendanceSnapshots
      summary: Stream complete attendance snapshots for listed Meets
      description: |
        Requires authentication and Group visibility. Repeat meet_id once for
        each displayed Meet; supply 1-50 distinct IDs and every Meet must belong
        to the requested Group. Each attendance_snapshots event is a complete
        replacement for all listed Meets and includes a Group cursor plus the
        per-Meet snapshots. Reconnection returns the latest complete view, not
        an event history. Attendance, relevant Meet and public-profile changes
        refresh the view. A committed authorization change sends a cursorless
        view_reset event with data {} and closes the stream.
      security:
        - bearerAuth: []
      parameters:
        - name: meet_id
          in: query
          required: true
          description: Repeat for each Meet to follow; all IDs must belong to this Group.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            uniqueItems: true
            items:
              type: string
              minLength: 1
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE stream of complete attendance snapshots for the listed Meets.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                id: opaque-group-cursor
                event: attendance_snapshots
                data: {"cursor":"opaque-group-cursor","meets":[{"meet_id":"meet-id","entries":{"venue-id":{"can_come":["user-id"],"cannot_come":[],"eta":{"user-id":"19:15"}}},"participants":{"user-id":{"id":"user-id","name":"Display name"}},"revision":"2026-11-24T18:15:00Z","cursor":"opaque-meet-cursor"}]}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Attendance or authoritative Group access is temporarily unavailable.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Firebase Authentication ID token supplied as a bearer token.
  parameters:
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LocationId:
      name: location_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    VenueId:
      name: venue_id
      in: path
      required: true
      description: Venue ID, or the literal any for the independent Any-Venue response.
      schema:
        type: string
        minLength: 1
    MeetId:
      name: meet_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request or domain validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: invalid_request
              message: The request is invalid.
    Unauthorized:
      description: Missing, invalid or expired credentials for an operation requiring authentication, or invalid credentials supplied to an optionally authenticated operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthenticated
              message: Authentication is required or the supplied token is invalid.
    Forbidden:
      description: The caller is authenticated but is not authorised to perform the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden
              message: You are not authorised to perform this operation.
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: not_found
              message: Resource not found.
    Conflict:
      description: The request conflicts with current domain state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: conflict
              message: The operation conflicts with the current state.
    PreconditionRequired:
      description: A required signed venue edit baseline or whole-document delete token is missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: precondition_required
              message: A required venue precondition token is missing.
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: An unexpected error occurred.
  schemas:
    VotingSnapshot:
      type: object
      required: [options, selected_option_ids]
      properties:
        options:
          type: array
          items:
            type: object
            required: [id, total, anonymous_count, voters]
            properties:
              id:
                type: string
              total:
                type: integer
                minimum: 0
              anonymous_count:
                type: integer
                minimum: 0
              voters:
                type: array
                description: Visible voters, ordered by user ID.
                items:
                  type: object
                  required: [id]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    photo_url:
                      type: string
        selected_option_ids:
          type: array
          items:
            type: string
        vote_revision:
          type: string
          nullable: true
        cursor:
          type: string
          description: Opaque cursor included in stream events.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable explanation; clients should use code for programmatic handling.
    GroupVisibility:
      type: string
      enum: [public, private]
    GroupSummary:
      type: object
      required: [id, name, visibility]
      properties:
        id:
          type: string
          description: Opaque stable group ID.
        name:
          type: string
        visibility:
          $ref: '#/components/schemas/GroupVisibility'
    Group:
      allOf:
        - $ref: '#/components/schemas/GroupSummary'
        - type: object
          required: [created_by, member_ids]
          properties:
            created_by:
              type: string
              description: User ID of the original creator; not itself an ongoing permission grant.
            member_ids:
              type: array
              items:
                type: string
              description: Current group member IDs. Returned only to callers authorised to view membership.
            default_location_id:
              type: [string, 'null']
    CreateGroupRequest:
      type: object
      required: [name, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/GroupVisibility'
        default_location_id:
          type: [string, 'null']
    UpdateGroupRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          $ref: '#/components/schemas/GroupVisibility'
        default_location_id:
          type: [string, 'null']
      additionalProperties: false
    GroupMember:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
        display_name:
          type: string
        photo_url:
          type: string
          format: uri
    GroupPermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          description: Permission-oriented assignment map. Keys are server-recognised permission names; values are user IDs granted that permission.
          additionalProperties:
            type: array
            uniqueItems: true
            items:
              type: string
          example:
            admin: [user-1]
            canVote: [user-1, user-2]
            canCompleteMeet: [user-1]
    GroupSettings:
      type: object
      required: [default_location_id, automation, notifications]
      properties:
        default_location_id:
          type: [string, 'null']
        automation:
          $ref: '#/components/schemas/AutomationSettings'
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
    GroupSettingsPatch:
      type: object
      minProperties: 1
      properties:
        default_location_id:
          type: [string, 'null']
        automation:
          $ref: '#/components/schemas/AutomationSettingsPatch'
        notifications:
          $ref: '#/components/schemas/NotificationSettingsPatch'
      additionalProperties: false
    AutomationSettings:
      type: object
      required: [poll_creation, poll_completion]
      properties:
        poll_creation:
          $ref: '#/components/schemas/ScheduledAutomation'
        poll_completion:
          $ref: '#/components/schemas/ScheduledAutomation'
    AutomationSettingsPatch:
      type: object
      properties:
        poll_creation:
          $ref: '#/components/schemas/ScheduledAutomationPatch'
        poll_completion:
          $ref: '#/components/schemas/ScheduledAutomationPatch'
      additionalProperties: false
    ScheduledAutomation:
      type: object
      required: [enabled, schedule]
      properties:
        enabled:
          type: boolean
        schedule:
          type: string
          description: Provisional schedule representation; exact grammar and timezone semantics must be agreed before implementation.
          examples: ['weekly;day=friday;time=09:00']
    ScheduledAutomationPatch:
      type: object
      properties:
        enabled:
          type: boolean
        schedule:
          type: string
      additionalProperties: false
    NotificationSettings:
      type: object
      required: [mailing_list]
      properties:
        mailing_list:
          type: [string, 'null']
          format: email
    NotificationSettingsPatch:
      type: object
      properties:
        mailing_list:
          type: [string, 'null']
          format: email
      additionalProperties: false
    Location:
      type: object
      required: [id, name, notes]
      properties:
        id:
          type: string
        name:
          type: string
        notes:
          type: string
    LocationWrite:
      type: object
      required: [name, notes]
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type: string
    LocationPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type: string
      additionalProperties: false
    LocationList:
      type: object
      required: [locations, next_cursor]
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        next_cursor:
          type: [string, 'null']
    VenueType:
      type: string
      enum: [pub, restaurant, event]
    Recurrence:
      type: object
      description: Recurrence configuration used primarily by event-type venues. Exact supported grammar should match existing recurrence logic.
      additionalProperties: true
    Venue:
      type: object
      required: [id, name, venue_type, address, food, banned, visible_group_ids, previous_venue_ids, edit_tokens, delete_token]
      properties:
        id:
          type: string
        name:
          type: string
        venue_type:
          $ref: '#/components/schemas/VenueType'
        website_url:
          type: [string, 'null']
          format: uri
        map_url:
          type: [string, 'null']
          format: uri
        address:
          type: string
        notes:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        next_occurrence_date:
          type: [string, 'null']
          format: date
        parking:
          type: boolean
        food:
          type: boolean
        dog_friendly:
          type: boolean
        beer_garden:
          type: boolean
        out_of_town:
          type: boolean
        banned:
          type: boolean
        location_id:
          type: [string, 'null']
        visible_group_ids:
          type: array
          items:
            type: string
        previous_venue_ids:
          type: array
          items:
            type: string
        edit_tokens:
          type: object
          description: Signed field baselines keyed by editable venue API field name.
          additionalProperties:
            type: string
        delete_token:
          type: string
          description: Signed whole-document version token for a conditional DELETE request.
    VenueWrite:
      type: object
      required: [name, venue_type, address]
      properties:
        name:
          type: string
          minLength: 1
        venue_type:
          $ref: '#/components/schemas/VenueType'
        website_url:
          type: [string, 'null']
          format: uri
        map_url:
          type: [string, 'null']
          format: uri
        address:
          type: string
        notes:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        next_occurrence_date:
          type: [string, 'null']
          format: date
        parking:
          type: boolean
        food:
          type: boolean
        dog_friendly:
          type: boolean
        beer_garden:
          type: boolean
        out_of_town:
          type: boolean
        banned:
          type: boolean
        location_id:
          type: [string, 'null']
        visible_group_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    VenuePatch:
      type: object
      required: [edit_tokens]
      minProperties: 2
      properties:
        name:
          type: string
          minLength: 1
        venue_type:
          $ref: '#/components/schemas/VenueType'
        website_url:
          type: [string, 'null']
          format: uri
        map_url:
          type: [string, 'null']
          format: uri
        address:
          type: string
        notes:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        recurrence:
          oneOf:
            - $ref: '#/components/schemas/Recurrence'
            - type: 'null'
        next_occurrence_date:
          type: [string, 'null']
          format: date
        parking:
          type: boolean
        food:
          type: boolean
        dog_friendly:
          type: boolean
        beer_garden:
          type: boolean
        out_of_town:
          type: boolean
        banned:
          type: boolean
        location_id:
          type: [string, 'null']
        visible_group_ids:
          type: array
          items:
            type: string
        edit_tokens:
          type: object
          description: Signed baseline tokens for exactly the venue fields included in this patch.
          additionalProperties:
            type: string
      additionalProperties: false
    VenueList:
      type: object
      required: [venues, next_cursor]
      properties:
        venues:
          type: array
          items:
            $ref: '#/components/schemas/Venue'
        next_cursor:
          type: [string, 'null']
    VenueSummary:
      type: object
      description: Current details for an active or soft-deleted Venue referenced by a Meet.
      required: [id, status, name, address]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, deleted]
        name:
          type: string
        address:
          type: string
        website_url:
          type: [string, 'null']
          format: uri
        image_url:
          type: [string, 'null']
          format: uri
        venue_type:
          $ref: '#/components/schemas/VenueType'
    MissingVenueReference:
      type: object
      description: The authoritative Venue document is confirmed absent; no details are invented.
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [missing]
    AttendanceStatistics:
      type: object
      additionalProperties: false
      required:
        - counts_by_venue_id
        - last_date_by_venue_id
      properties:
        counts_by_venue_id:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        last_date_by_venue_id:
          type: object
          additionalProperties:
            type: string
            format: date
            nullable: true
    AttendanceCounts:
      type: object
      required: [attending_count, not_attending_count]
      properties:
        attending_count:
          type: integer
          minimum: 0
        not_attending_count:
          type: integer
          minimum: 0
    Meet:
      type: object
      required: [id, group_id, date, voting_complete, venue, previous_venue_ids]
      properties:
        id:
          type: string
        group_id:
          type: string
        date:
          type: string
          format: date
        voting_complete:
          type: boolean
          description: True once a venue has been selected and the voting phase is complete.
        venue:
          oneOf:
            - $ref: '#/components/schemas/VenueSummary'
            - $ref: '#/components/schemas/MissingVenueReference'
            - type: 'null'
          description: Null when no Venue is selected; missing references retain their Venue ID.
        candidate_venue_ids:
          type: array
          description: Active Venue candidates for the Meet; excludes the reserved `any` voting option.
          items:
            type: string
        restaurant_id:
          type: [string, 'null']
        restaurant_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Local wall-clock time HH:MM; present if and only if restaurant_id is set.
        previous_venue_ids:
          type: array
          items:
            type: string
    PastMeet:
      type: object
      required: [id, date, venue]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        venue:
          oneOf:
            - $ref: '#/components/schemas/VenueSummary'
            - $ref: '#/components/schemas/MissingVenueReference'
            - type: 'null'
          description: Null when no Venue is selected; missing references retain their Venue ID.
    CurrentMeetsSnapshot:
      type: object
      required: [cursor, meets]
      properties:
        cursor:
          type: string
          description: Opaque stream cursor corresponding to this consistent snapshot.
        meets:
          type: array
          items:
            $ref: '#/components/schemas/Meet'
    OpenMeetsSnapshot:
      type: object
      required: [cursor, meets]
      properties:
        cursor:
          type: string
          description: Opaque stream cursor corresponding to this consistent open-Meets snapshot.
        meets:
          type: array
          items:
            $ref: '#/components/schemas/Meet'
    PastMeetsPage:
      type: object
      required: [meets, next_cursor]
      properties:
        meets:
          type: array
          items:
            $ref: '#/components/schemas/PastMeet'
        next_cursor:
          type: [string, 'null']
    CompleteMeetRequest:
      type: object
      required: [venue_id]
      properties:
        venue_id:
          type: string
          minLength: 1
        restaurant_id:
          type: [string, 'null']
        restaurant_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      allOf:
        - if:
            properties:
              restaurant_id:
                type: string
            required: [restaurant_id]
          then:
            required: [restaurant_time]
            properties:
              restaurant_time:
                type: string
          else:
            properties:
              restaurant_time:
                type: 'null'
    RescheduleMeetRequest:
      type: object
      minProperties: 1
      properties:
        venue_id:
          type: string
          minLength: 1
        restaurant_id:
          type: [string, 'null']
        restaurant_time:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Supply only fields being changed. A supplied date is rejected. If restaurant_id is non-null, supply a restaurant_time or preserve the existing time for a time-only update. Clearing restaurant_id also clears restaurant_time. Venue-only changes do not reopen voting.
      additionalProperties: false
    AttendanceStatus:
      type: string
      enum: [attending, not_attending]
    AttendancePatch:
      type: object
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        eta:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      additionalProperties: false
    AttendanceUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AttendanceStatus'
      additionalProperties: false
    MyAttendance:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        eta:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    AttendanceParticipant:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
        photo_url:
          type: string
          format: uri
      additionalProperties: false
    AttendanceEntry:
      type: object
      required: [can_come, cannot_come, eta]
      properties:
        can_come:
          type: array
          items:
            type: string
            minLength: 1
        cannot_come:
          type: array
          items:
            type: string
            minLength: 1
        eta:
          type: object
          additionalProperties:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      additionalProperties: false
    AttendanceSnapshot:
      type: object
      required: [meet_id, entries, participants, revision, cursor]
      properties:
        meet_id:
          type: string
          minLength: 1
        entries:
          type: object
          description: Existing per-Venue records, including the reserved any entry when present.
          additionalProperties:
            $ref: '#/components/schemas/AttendanceEntry'
        participants:
          type: object
          description: Public profiles for participants in the attendance entries, independent of vote visibility.
          additionalProperties:
            $ref: '#/components/schemas/AttendanceParticipant'
        revision:
          type: [string, 'null']
          format: date-time
        cursor:
          type: string
          description: Opaque per-Meet cursor corresponding to this complete snapshot.
      additionalProperties: false
    GroupAttendanceSnapshot:
      type: object
      required: [cursor, meets]
      properties:
        cursor:
          type: string
          description: Opaque cursor for the complete Group view.
        meets:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceSnapshot'
      additionalProperties: false
